name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Code quality: is the code correctly formatted, lint-clean, and does it build?
  quality:
    name: Quality (lint, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Lint (eslint)
        run: npm run eslint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Build
        run: npm run build

  # Security: are any dependencies carrying known critical vulnerabilities?
  security:
    name: Security (dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      # react-router currently has one high-severity advisory (RSC/Actions
      # CSRF bypass) that doesn't apply to this app's plain BrowserRouter
      # setup, with no patched version yet. Gate on critical until it's
      # fixed upstream, then tighten back to "high".
      - name: npm audit
        run: npm audit --audit-level=critical
