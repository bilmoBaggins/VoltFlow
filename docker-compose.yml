services:
  mysql:
    image: mysql:8.4
    container_name: voltflow-mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voltflow_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voltflow}
      MYSQL_USER: ${MYSQL_USER:-voltflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voltflow}
    volumes:
      - voltflow_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-voltflow_root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    container_name: voltflow-mailpit
    restart: unless-stopped
    ports:
      # SMTP — app sends mail here
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      # Web UI — open in browser to read mail
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - voltflow_mailpit_data:/data

volumes:
  voltflow_mysql_data:
  voltflow_mailpit_data:
